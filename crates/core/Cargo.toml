[package]
name = "nixos-manager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Nixos-manager: config discovery, Nix file parsing and editing, deploy jobs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
chrono.workspace = true
uuid.workspace = true
rnix = "0.14"
rowan = "0.16"
walkdir = "2"
directories = "6"
sha2 = "0.10"
libc = "0.2"
hex = "0.4"
similar = "2"
sha-crypt = "0.5"
age = "0.11"
secrecy = "0.10"

[dev-dependencies]
tempdir = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
